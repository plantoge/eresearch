; Queue worker untuk eresearch — proses terpisah dari Octane (lihat docs/arsitektur.md §6.4).
; Tanpa ini, job yang di-queue (mis. KirimNotifikasiTelegram, email lewat Resend) numpuk
; diam-diam di tabel `jobs` — tidak ada error, cuma tidak pernah terkirim.
;
; Install:
;   sudo cp deploy/supervisor/eresearch-queue.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start eresearch-queue:*
;
; Setelah deploy baru (kode job berubah), restart supaya worker lama tidak jalan dengan
; kode usang (worker mem-load class job saat boot, bukan per-job):
;   sudo supervisorctl restart eresearch-queue:*

[program:eresearch-queue]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/eresearch
command=php artisan queue:work --tries=3 --timeout=90 --sleep=3
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/eresearch/storage/logs/queue-worker.log
stopwaitsecs=3600
